<h1>函数</h1>
<div class="intro">
<p><strong>函数</strong>是C程序的基本模块，用于封装可复用的代码。核心知识点：</p>
<ul>
<li>函数定义：返回类型 函数名(参数列表) { 函数体 }</li>
<li><strong>值传递</strong>：C函数参数默认按值传递，形参的修改不影响实参</li>
<li><strong>返回值</strong>：用 return 带回结果；void 表示不返回</li>
<li><strong>局部变量</strong>：在函数内声明，函数结束时销毁（存于栈上）</li>
<li><strong>递归</strong>：函数调用自身，必须有终止条件否则死循环</li>
<li>函数必须先声明或定义后，才能被调用</li>
</ul>
</div>

    printf("%c -> %c\\n", from, to);

  code: `#include <stdio.h>

    a = b;
    b = tmp;
}

    printf("x=%d, y=%d\\n", x, y);
    return 0;
}`,
  answer: "x=3, y=7",
  explain: "C 语言参数是<strong>值传递</strong>：形参 a、b 只是实参 x、y 的副本。swap 函数里交换的是副本，函数结束后副本销毁，main 里的 x 和 y 纹丝不动，所以输出仍是 <code>x=3, y=7</code>。"
});

  code: `#include <stdio.h>

  accept: [`#include <stdio.h>

int factorial(int n) {
    if (n <= 1) return 1;
    return n * factorial(n - 1);
}

int main() {
    printf("5! = %d\\n", factorial(5));
    return 0;
}`],
  explain: "递归函数必须有<strong>终止条件</strong>（基准情形）。这里没有它，factorial 会无限自我调用直到栈溢出崩溃。最小修改：在递归前加 <code>if (n <= 1) return 1;</code>，0! = 1! = 1 时不再递归。"
});
