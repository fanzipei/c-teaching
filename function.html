<h1>函数</h1>
<div class="intro">
<div class="intro-flex">
<div class="intro-main">
<p><strong>函数</strong>是C程序的基本模块，用于封装可复用的代码。核心知识点：</p>
<ul>
<li>函数定义：返回类型 函数名(参数列表) { 函数体 }</li>
<li><strong>值传递</strong>：C函数参数默认按值传递，形参的修改不影响实参</li>
<li><strong>返回值</strong>：用 return 带回结果；void 表示不返回</li>
<li><strong>局部变量</strong>：在函数内声明，函数结束时销毁（存于栈上）</li>
<li><strong>递归</strong>：函数调用自身，必须有终止条件否则死循环</li>
<li>函数必须先声明或定义后，才能被调用</li>
</ul>
</div>
